name: Build Frontend

# 可复用的前端构建 workflow。
# ci.yml / release.yml 通过 `uses: ./.github/workflows/build-frontend.yml` 调用。
#
# 设计说明：
# - 本地可复用 workflow（uses: ./.github/workflows/...）与调用方在同一个 runner、
#   同一个 job 中执行，共享 checkout 的 workspace，因此构建产物 frontend/dist/
#   可被调用方后续步骤直接使用，行为与内联这些步骤完全一致。
# - runs-on 由调用方通过 inputs.runs-on 传入，跟随调用方 job 的运行平台
#   （如 ci 的 ${{ matrix.os }}、release 的 windows-latest 等），避免两处不一致。
on:
  workflow_call:
    inputs:
      runs-on:
        type: string
        required: true
        description: 运行平台（跟随调用方 job 的 runner，如 ubuntu-latest / windows-latest / 矩阵）

jobs:
  build-frontend:
    name: build frontend
    runs-on: ${{ inputs.runs-on }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # pnpm/action-setup@v4 内置 pnpm store 缓存：cache: true 启用，
      # cache_dependency_path 指向 frontend/ 下的 lockfile（该 lockfile 的 hash 用作缓存 key）。
      # 注意：frontend/ 是独立 pnpm 工作区（有 pnpm-workspace.yaml），lockfile 不在仓库根。
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - name: build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
