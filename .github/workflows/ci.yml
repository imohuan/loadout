name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # 复用前端构建 workflow（内含 setup-node + pnpm store 缓存 + install + build）
      - uses: ./.github/workflows/build-frontend.yml
        with:
          runs-on: ${{ matrix.os }}
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          # setup-go 自带缓存（默认开启），缓存 go modules 与 build outputs，
          # go.sum 位于仓库根，cache-dependency-path 无需额外指定。
          cache: true
      - name: go test
        run: go test ./...
      - name: go vet
        run: go vet ./...
