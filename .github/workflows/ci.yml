name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # pnpm/action-setup 内置 pnpm store 缓存：cache + cache_dependency_path 指向 frontend/ 的 lockfile
      - uses: pnpm/action-setup@v4
        with:
          version: 9
          cache: true
          cache_dependency_path: frontend/pnpm-lock.yaml
      - name: build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          # setup-go 自带缓存（默认开启），缓存 go modules 与 build outputs，
          # go.sum 位于仓库根，cache-dependency-path 无需额外指定。
          cache: true
      - name: go test
        run: go test ./...
      - name: go vet
        run: go vet ./...
